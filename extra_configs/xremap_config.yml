virtual_modifiers:
  - Email
modmap:
  # - name: CapsLock
  #   remap:
  #     Capslock:
  #       held: Capslock
  #       alone: backslash
  - name: Muhenkan
    remap:
      KEY_MUHENKAN:
        held: KEY_Email
        alone: KEY_MUHENKAN
        free_hold: true
  - name: Super xcape
    remap:
      Win_L:
        held: Win_L
        alone: Key_Chat
        free_hold: true
  - name: Map katakana_hiragana
    remap:
      KEY_KATAKANAHIRAGANA: KEY_SHOP
keymap:
  - name: ZenkakuHankaku to Esc
    remap:
      KEY_GRAVE: Esc
  - name: Muhenkan plus
    remap:
      Email-h: Left
      Email-j: Down
      Email-k: Up
      Email-l: Right
      Email-a: Home
      Email-s: PageUp
      Email-d: PageDown
      Email-f: End
    mode: default
  - name: Turn on numpad mode
    remap:
      KEY_SHOP: { set_mode: Numpad }
    mode: default
  - name: Turn off numpad mode
    remap:
      KEY_SHOP: { set_mode: default }
    mode: Numpad
  - name: Numpad
    remap:
      m: KEY_KP0
      j: KEY_KP1
      k: KEY_KP2
      l: KEY_KP3
      u: KEY_KP4
      i: KEY_KP5
      o: KEY_KP6
      7: KEY_KP7
      8: KEY_KP8
      9: KEY_KP9
      n: KEY_NUMLOCK
    mode: Numpad
experimental_map:
  - chords:
    - keys: [Super_L, Shift_L, F23]
      actions: Ctrl_R
      timeout: 30
